# The heavy checks live here, the commit gate stays light: pre-commit runs
# the fast hooks per commit, CI runs everything on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run mypy src/
      - run: uv run pytest tests/ -q -m "not live and not smoke"
      - run: uv run python scripts/export_openapi_schema.py --check

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:locales
      - run: npm test

  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - name: Install the webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      # The build script checks the bundled resources exist, and the frozen
      # engine lands in this folder only during a release build.
      - run: mkdir sidecar
      # Some code compiles only into release builds, so both get linted.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked
