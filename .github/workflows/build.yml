# Builds the desktop app's installers on every OS it ships for. PyInstaller
# cannot cross-compile, so each OS freezes its own engine on its own runner.
# A build takes long, so it runs only for release tags and for whatever is
# pushed to build-test: git push --force origin HEAD:build-test
# A release tag also drafts the GitHub Release with every OS's installers.
name: build

on:
  push:
    tags: ['v*']
    branches: [build-test]

jobs:
  app:
    strategy:
      # One OS failing must not hide whether the others build.
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the AppImage and .deb link against
        # a glibc that newer distributions still run.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(jq -r .version shell/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the app's version $version"
            exit 1
          fi

      - name: Install the webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: engine

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
        working-directory: panel

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # Builds the panel, freezes the engine, writes the third-party notices
      # and compiles the shell, through the beforeBuildCommand in
      # tauri.release.conf.json. It also signs every installer the app can
      # update itself from, with the key whose public half the app checks.
      - run: npm run tauri build -- --config ../shell/tauri.release.conf.json
        working-directory: panel
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}


      # Runs the engine this OS just froze, the way the shell runs it.
      - run: uv run pytest -m smoke -v
        working-directory: engine

      # macOS refuses to open a downloaded app whose signature is missing or
      # broken, and tells the user the app is damaged. So a bad signature
      # fails the build instead of reaching a release.
      - name: Check the app's signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 shell/target/release/bundle/macos/rentczecher.app

      - uses: actions/upload-artifact@v4
        with:
          name: rentczecher-${{ runner.os }}
          path: |
            shell/target/release/bundle/deb/*.deb
            shell/target/release/bundle/appimage/*.AppImage
            shell/target/release/bundle/msi/*.msi
            shell/target/release/bundle/nsis/*.exe
            shell/target/release/bundle/dmg/*.dmg
            shell/target/release/bundle/macos/*.app.tar.gz
            shell/target/release/bundle/*/*.sig
          if-no-files-found: error

      # A release publishes each installer under a name without the version,
      # so a link to releases/latest/download/<name> always finds the newest.
      - name: Name the installers for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir release
          bundle=shell/target/release/bundle
          case "$RUNNER_OS" in
            Linux)
              cp $bundle/appimage/*.AppImage release/rentczecher-linux-x86_64.AppImage
              cp $bundle/deb/*.deb release/rentczecher-linux-amd64.deb
              ;;
            Windows)
              cp $bundle/nsis/*.exe release/rentczecher-windows-x64-setup.exe
              ;;
            macOS)
              cp $bundle/dmg/*.dmg release/rentczecher-macos-arm64.dmg
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  # Drafts the GitHub Release once every OS has built, so a release never goes
  # out with an installer missing. Publishing the draft is done by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --verify-tag --generate-notes
          --title "rentczecher $GITHUB_REF_NAME"
