# Every license a bundled package may use, whether a Rust crate, a Python
# package or an npm package. All of them can be combined into a GPL-3.0 work,
# so a package under any other license fails the release build.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "PSF-2.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
