[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rentczecher"
version = "0.1.0"
description = "Multi-portal Czech real-estate watchdog: scrape, dedup, score, notify"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2,<3",
]

[project.scripts]
rentczecher = "rentczecher.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "prek",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rentczecher"]

[tool.pytest.ini_options]
markers = [
    "live: hits real portals; excluded from the default run",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors only, pinned explicitly so findings do not
# change when ruff's default rule selection does.
select = ["E4", "E7", "E9", "F"]
# The codebase idiomatically uses `l` for listings.
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
