  portals: [sreality, bezrealitky]
  search:
    offer_type: rent
    estate_type: flat
    place: obvod Praha 7
    min_price: 15000
    max_price: 30000
    min_size_m2: 40
    max_size_m2: 90
    dispositions: [2+kk, 2+1, 3+kk]
