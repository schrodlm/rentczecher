# rentczecher - multi-profile configuration
# Each profile is an independent search with its own scrapers, filters, and scoring.

schedule:
  cron_interval_hours: 3

profiles:
  # Profile 1: Praha 7 flat rentals
  praha7-byty:
    name: "Praha 7 - byty k pronajmu"
    enabled: true

    search:
      offer_type: rent          # rent | sale
      estate_type: flat         # flat | house | land | cottage
      place: obvod Praha 7      # a kraj, okres or Praha obvod, by its kind and name
      max_price: 25000
      min_rooms: 2              # 1-9, leave out for no bound
      max_rooms: 3
      kitchen: kitchenette      # kitchenette (N+kk) | separate (N+1), leave out for either

    scrapers: [sreality, bezrealitky, remax]

    scoring:
      price_per_m2_weight: 40
      disposition_weight: 30
      preferred_dispositions:
        - "2+kk"
        - "2+1"
        - "3+kk"
        - "1+1"
      size_weight: 15
      ideal_size_m2: 55
      place_weight: 15
      preferred_places:         # any place by its kind and name, best first
        - cast_obce Bubeneč
        - obvod Praha 7

  # Profile 2: Domazlice houses/cottages for sale
  domazlice-domy:
    name: "Domazlicko - domy a chalupy"
    enabled: true

    search:
      offer_type: sale
      estate_type: house        # house | cottage | land
      place: okres Domažlice
      max_price: 5000000
      min_land_m2: 500          # Minimum land/plot area

    scrapers: [sreality, bezrealitky, remax]

    scoring:
      price_per_m2_weight: 0      # Not relevant for houses
      disposition_weight: 0
      preferred_dispositions: []
      size_weight: 30
      ideal_size_m2: 150
      place_weight: 0
      preferred_places: []
      land_weight: 40             # Bigger land = better
      ideal_land_m2: 2000
      price_weight: 30            # Lower total price = better
      max_good_price: 3000000     # Price considered "good"
