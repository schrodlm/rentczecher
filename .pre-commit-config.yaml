# Pre-commit hooks, run by prek (https://github.com/j178/prek).
# Setup: uv sync --extra dev && uv run prek install
# Run manually: uv run prek run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  # Local hooks run through uv so they use the exact tool versions from
  # uv.lock instead of a separately pinned copy.
  - repo: local
    hooks:
      # Report-only (no --fix): an in-hook fix that overlaps an unstaged
      # hunk wedges prek's stash/restore into an unrecoverable retry loop.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        types: [python]

      # Not filtered to Python files: fixture and config changes can break
      # tests too, and the offline suite costs well under a second. The
      # live-marker exclusion is repeated here so the commit gate cannot
      # hit real portals even if pyproject's addopts changes.
      - id: pytest-offline
        name: pytest (offline suite)
        entry: uv run pytest tests/ -q -m "not live"
        language: system
        pass_filenames: false
        always_run: true
