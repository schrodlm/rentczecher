[package]
name = "rentczecher"
description = "The rentczecher desktop shell"
authors = ["Matěj Schrödl"]
repository = "https://github.com/schrodlm/rentczecher"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rentczecher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
getrandom = "0.4.3"
ureq = { version = "3.4.2", default-features = false }
tauri-plugin-dialog = "2"
